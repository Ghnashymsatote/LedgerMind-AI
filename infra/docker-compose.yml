name: ledgermind-ai

services:
  web:
    build: &node-build
      context: ..
      dockerfile: infra/Node.Dockerfile
    command: ["pnpm", "--filter", "@ledgermind/web", "dev"]
    init: true
    environment:
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env}
      NEXT_TELEMETRY_DISABLED: "1"
      INVOICE_MAX_FILE_BYTES: ${INVOICE_MAX_FILE_BYTES:-10485760}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: *node-build
    command: ["pnpm", "--filter", "@ledgermind/api", "dev"]
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:${WEB_PORT:-3000}}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:?Set AI_SERVICE_URL in .env}
      INVOICE_MAX_FILE_BYTES: ${INVOICE_MAX_FILE_BYTES:-10485760}
      INVOICE_STORAGE_DIR: /var/lib/ledgermind/invoices
      EXTRACTION_TIMEOUT_MS: ${EXTRACTION_TIMEOUT_MS:-30000}
    volumes:
      - invoice-files:/var/lib/ledgermind/invoices
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: *node-build
    command: ["pnpm", "--filter", "@ledgermind/database", "migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ../apps/ai-service
    init: true
    environment:
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.8-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  invoice-files:
